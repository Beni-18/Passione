name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install mlcore (editable, docs/INTEGRATION.md Seam 1)
        run: pip install -r ml/requirements.txt && pip install --no-deps -e ml

      - name: Lint
        working-directory: backend
        run: ruff check app

      - name: Test
        env:
          PYTHONPATH: backend
        run: python -m pytest tests -v
