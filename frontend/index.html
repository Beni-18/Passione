<!doctype html>
<!--
  Passioné — minimal UI shell.
  One page: a metadata form, a score/ungrounded display, and a metrics
  panel. Genuinely minimal, unstyled beyond styles.css basics — this is a
  placeholder for Teammate B, not the real UI. Holds no logic of its own;
  app.js does all fetching and rendering.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Passioné</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Passioné</h1>
  <p>Trending-likelihood scoring for newly uploaded films.</p>

  <form id="predict-form">
    <label>Title <input name="title" required /></label>
    <label>Genre <input name="genre" required /></label>
    <label>Duration (minutes) <input name="duration_minutes" type="number" required /></label>
    <label>Upload time <input name="upload_time" type="datetime-local" required /></label>
    <label>Language <input name="language" required /></label>
    <label>Tags (comma-separated) <input name="tags" /></label>
    <button type="submit">Score it</button>
  </form>

  <section id="result"></section>
  <section id="metrics"></section>

  <script src="app.js"></script>
</body>
</html>
